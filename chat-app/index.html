<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Realtime Tuần 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 1. ĐĂNG NHẬP -->
        <div id="login-screen" class="card">
            <h2>💬 Nhóm Chat Realtime</h2>
            <div class="form-group">
                <input type="text" id="username-input" placeholder="Nhập tên tài khoản..." />
                <select id="room-select">
                    <option value="chung">Phòng Chung 💬</option>
                    <option value="hoc-tap">Phòng Học Tập 📚</option>
                    <option value="giai-tri">Phòng Giải Trí 🎮</option>
                </select>
            </div>
            <button id="login-btn">Vào Phòng Chat</button>
        </div>

        <!-- 2. PHÒNG CHAT chính -->
        <div id="chat-screen" class="card hidden">
            <div class="chat-header">
                <div>
                    <h3 id="room-title">Phòng Chat</h3>
                    <small id="user-info"></small>
                </div>
                <button id="logout-btn">Thoát</button>
            </div>

            <div class="chat-body">
                <!-- Cột hiển thị tin nhắn -->
                <div class="messages-container" id="messages-container"></div>

                <!-- Cột danh sách Online -->
                <div class="online-users-sidebar">
                    <h4>Online (<span id="user-count">0</span>)</h4>
                    <ul id="users-list"></ul>
                </div>
            </div>

            <div class="chat-footer">
                <input type="text" id="message-input" placeholder="Nhập tin nhắn..." />
                <button id="send-btn">Gửi</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
