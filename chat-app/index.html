<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ (TELEGRAM STYLE) -->
    <div id="login-screen" class="tg-auth-container">
        <div class="tg-auth-card">
            <div class="tg-logo">✈️</div>
            <h2>Ứng dụng chat</h2>
            <p style="color: #7f91a4; font-size: 13px; margin-bottom: 20px;">Vui lòng đăng nhập để bắt đầu trò chuyện</p>

            <div class="auth-tabs">
                <button id="tab-login-btn" class="active">Đăng nhập</button>
                <button id="tab-register-btn">Đăng ký</button>
            </div>

            <div class="auth-form">
                <input type="text" id="username-input" placeholder="Tên tài khoản..." />
                <input type="password" id="password-input" placeholder="Mật khẩu..." />
                <input type="password" id="confirm-password-input" placeholder="Xác nhận mật khẩu..." class="hidden" />
                <button id="auth-submit-btn" class="btn-telegram">ĐĂNG NHẬP</button>
            </div>
        </div>
    </div>

    <!-- 2. GIAO DIỆN TELEGRAM DESKTOP 2 CỘT -->
    <div id="chat-screen" class="tg-layout hidden">
        <!-- CỘT TRÁI: SIDEBAR DANH SÁCH CHAT -->
        <aside class="tg-sidebar">
            <div class="tg-sidebar-header">
                <button id="my-profile-modal-btn" class="tg-menu-btn" title="Cài đặt cá nhân">☰</button>
                <div class="tg-search-wrapper">
                    <input type="text" placeholder="Tìm kiếm..." />
                </div>
            </div>
            <ul id="users-list" class="tg-chat-list"></ul>
        </aside>

        <!-- CỘT PHẢI: KHUNG CHAT CHÍNH -->
        <main class="tg-chat-main">
            <div class="tg-chat-header">
                <div class="tg-header-info">
                    <img id="header-avatar" src="https://via.placeholder.com/40" class="tg-avatar" />
                    <div>
                        <h4 id="header-name">Chọn cuộc trò chuyện</h4>
                        <small id="header-status" class="tg-status">trực tuyến</small>
                    </div>
                </div>
                <button id="logout-btn" class="tg-icon-btn" title="Đăng xuất">🚪</button>
            </div>

            <div class="tg-messages-container" id="messages-container">
                <div class="tg-empty-notice">Chọn một cuộc trò chuyện để bắt đầu gửi tin nhắn</div>
            </div>

            <div class="tg-chat-footer">
                <input type="text" id="message-input" placeholder="Viết tin nhắn..." />
                <button id="send-btn" class="tg-send-btn">✈️</button>
            </div>
        </main>
    </div>

    <!-- MODAL PROFILE/SETTINGS (TELEGRAM STYLE) -->
    <div id="profile-modal" class="modal-overlay hidden">
        <div class="tg-modal-card">
            <h3>⚙️ Cài đặt tài khoản</h3>
            <div class="tg-form-group">
                <label>Tài khoản: <b id="profile-username" style="color: #5288c1;"></b></label>
                <input type="text" id="profile-avatar-input" placeholder="URL Ảnh đại diện..." />
                <input type="text" id="profile-bio-input" placeholder="Mô tả tiểu sử..." />
            </div>
            <div class="tg-modal-actions">
                <button id="save-profile-btn" class="btn-telegram">LƯU</button>
                <button id="close-profile-btn" class="btn-cancel">HỦY</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
