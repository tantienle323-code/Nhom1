<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Realtime Tuần 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
        <div id="login-screen" class="card">
            <h2>💬 Nhóm Chat Realtime</h2>
            
            <!-- Tab Chuyển đổi Form -->
            <div class="auth-tabs">
                <button id="tab-login-btn" class="active">Đăng nhập</button>
                <button id="tab-register-btn">Đăng ký</button>
            </div>

            <div class="auth-box">
                <div class="form-group">
                    <input type="text" id="username-input" placeholder="Nhập tên tài khoản..." />
                    <input type="password" id="password-input" placeholder="Nhập mật khẩu..." />
                    
                    <!-- Ô xác nhận mật khẩu (Chỉ hiện khi Đăng ký) -->
                    <input type="password" id="confirm-password-input" placeholder="Xác nhận lại mật khẩu..." class="hidden" />

                    <!-- Thẻ chọn phòng (Chỉ hiện khi Đăng nhập) -->
                    <div id="room-select-group">
                        <select id="room-select" style="width: 100%;">
                            <option value="chung">Phòng Chung 💬</option>
                            <option value="hoc-tap">Phòng Học Tập 📚</option>
                            <option value="giai-tri">Phòng Giải Trí 🎮</option>
                        </select>
                    </div>
                </div>

                <button id="auth-submit-btn" class="btn-primary" style="width: 100%; margin-top: 10px;">Vào Phòng Chat</button>
            </div>
        </div>

        <!-- 2. PHÒNG CHAT CHÍNH -->
        <div id="chat-screen" class="card hidden">
            <div class="chat-header">
                <div>
                    <h3 id="room-title">Phòng Chat</h3>
                    <small id="user-info"></small>
                </div>
                <button id="logout-btn">Thoát</button>
            </div>

            <div class="chat-body">
                <div class="messages-container" id="messages-container"></div>
                <div class="online-users-sidebar">
                    <h4>Online (<span id="user-count">0</span>)</h4>
                    <ul id="users-list"></ul>
                </div>
            </div>

            <div class="chat-footer">
                <input type="text" id="message-input" placeholder="Nhập tin nhắn..." />
                <button id="send-btn">Gửi</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
