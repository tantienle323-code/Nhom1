<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài khoản</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
        body { background: #f4f6f9; color: #263445; margin: 0; padding: 24px; }
        main { max-width: 1000px; margin: 0 auto; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 4px 18px #16283a18; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 2px solid #5288c1; padding-bottom: 16px; margin-bottom: 18px; }
        h1 { font-size: 22px; margin: 0; }
        .toolbar, .actions { display: flex; align-items: center; gap: 8px; }
        button, .link { display: inline-block; border: 0; border-radius: 6px; padding: 9px 12px; color: #fff; background: #5288c1; cursor: pointer; font-size: 14px; text-decoration: none; }
        button:hover, .link:hover { filter: brightness(.92); }
        button.danger { background: #dc3545; }
        button.warning { color: #263445; background: #ffc107; }
        #status { min-height: 22px; color: #5b6b7b; }
        #status.error { color: #bd2433; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e3e8ed; }
        th { background: #edf4fb; }
        @media (max-width: 650px) {
            body { padding: 10px; }
            main { padding: 16px; }
            header { align-items: flex-start; flex-direction: column; }
            .actions { align-items: stretch; flex-direction: column; }
            button { white-space: nowrap; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Quản lý tài khoản</h1>
            <nav class="toolbar">
                <a class="link" href="index.html">Quay lại chat</a>
                <button id="refresh-btn" type="button">Làm mới</button>
                <button id="logout-btn" type="button">Đăng xuất</button>
            </nav>
        </header>
        <p id="status" role="status">Đang kiểm tra quyền quản trị...</p>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>STT</th><th>Tài khoản</th><th>Ngày tạo</th><th>Thao tác</th></tr>
                </thead>
                <tbody id="user-table-body"></tbody>
            </table>
        </div>
    </main>
    <script src="admin.js"></script>
</body>
</html>
